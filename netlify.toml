[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Alte/kurze Adressen
[[redirects]]
  from = "/de/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/squadra-3/*"
  to = "/squadra-tre/"
  status = 301

[[redirects]]
  from = "/en/squadra-3/*"
  to = "/en/squadra-tre/"
  status = 301

[[redirects]]
  from = "/it/squadra-3/*"
  to = "/it/squadra-tre/"
  status = 301

[[redirects]]
  from = "/squadra/*"
  to = "/squadra-tre/"
  status = 301

[[redirects]]
  from = "/sponsoren/*"
  to = "/partner/"
  status = 301

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Das CMS lädt Decap von unpkg und spricht mit GitHub/Netlify
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.github.com https://api.netlify.com https://unpkg.com https://raw.githubusercontent.com blob:; frame-src 'self' https://api.netlify.com https://github.com"

# Geschützte Bereiche nie zwischenspeichern und nicht indexieren
[[headers]]
  for = "/bericht/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/wall-of-fame/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/wall/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/login/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Lange Cache-Zeiten für Schriften und Medien
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
