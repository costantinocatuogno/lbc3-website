[build]
  command = "node scripts/build.mjs"
  # Keine Veröffentlichung (spart Netlify-Credits), wenn ein NEUER Commit seit dem letzten Deploy nur Doku, Tests,
  # README/ANLEITUNG oder GitHub-Workflows ändert. Exit 0 = überspringen, sonst bauen.
  # Immer gebaut wird: erster Deploy, gleicher Commit (Build-Hook „Wall of Fame veröffentlichen“, Neu-Deploy von Hand),
  # alles unter content/ (News sind .md-Dateien!), scripts/, public/, netlify/, locales/, supabase/.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude,top)docs' ':(exclude,top)tests' ':(exclude,top).github' ':(exclude,top)README.md' ':(exclude,top)ANLEITUNG.md'"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Alte/kurze Adressen
[[redirects]]
  from = "/de/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/squadra-3/*"
  to = "/squadra-tre/"
  status = 301

[[redirects]]
  from = "/en/squadra-3/*"
  to = "/en/squadra-tre/"
  status = 301

[[redirects]]
  from = "/it/squadra-3/*"
  to = "/it/squadra-tre/"
  status = 301

[[redirects]]
  from = "/squadra/*"
  to = "/squadra-tre/"
  status = 301

[[redirects]]
  from = "/sponsoren/*"
  to = "/partner/"
  status = 301

# Kurze Adresse für die Ergebnisse
[[redirects]]
  from = "/ergebnisse/*"
  to = "/kalender/"
  status = 301

[[redirects]]
  from = "/en/results/*"
  to = "/en/kalender/"
  status = 301

[[redirects]]
  from = "/it/risultati/*"
  to = "/it/kalender/"
  status = 301

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Das CMS lädt Decap von unpkg und spricht mit GitHub/Netlify
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.github.com https://api.netlify.com https://unpkg.com https://raw.githubusercontent.com blob:; frame-src 'self' https://api.netlify.com https://github.com"

# Geschützte Bereiche nie zwischenspeichern und nicht indexieren
