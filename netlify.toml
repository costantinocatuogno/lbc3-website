# Lange Cache-Zeiten für Schriften und Medien
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Video-Untertitel (IT/EN/FR) – richtiger Typ, damit alle Browser die Spur laden
[[headers]]
  for = "/uploads/videos/untertitel/*"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
