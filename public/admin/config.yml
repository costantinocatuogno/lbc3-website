# Decap CMS – Redaktionsoberfläche unter https://luigi-catuogno.com/admin/
# Jede Änderung wird als Commit im GitHub-Repository gespeichert; Netlify baut die Website danach automatisch neu (1–2 Minuten).

backend:
  name: github
  repo: costantinocatuogno/lbc3-website
  branch: main
  base_url: https://api.netlify.com     # Netlify übernimmt die GitHub-Anmeldung (OAuth)
  commit_messages:
    create: 'Neu: {{collection}} „{{slug}}“'
    update: 'Geändert: {{collection}} „{{slug}}“'
    delete: 'Gelöscht: {{collection}} „{{slug}}“'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'

locale: de
site_url: https://luigi-catuogno.com
display_url: https://luigi-catuogno.com
logo_url: /assets/img/lbc3-logo.png
media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: single_file
  locales: [de, it, en, fr]
  default_locale: de

collections:
  # ---------------------------------------------------------------- NEWS
  - name: news
    label: News & Rennberichte
    label_singular: Beitrag
    folder: content/news
    create: true
    format: json-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{datum | date("DD.MM.YYYY")}} · {{titel}}'
    sortable_fields: [datum, titel]
    view_filters:
      - { label: Highlights, field: highlight, pattern: true }
      - { label: Entwürfe, field: entwurf, pattern: true }
    fields:
      - { label: Sprache, in der du schreibst, name: sprache, widget: select, options: [{ label: Deutsch, value: de }, { label: Italienisch, value: it }, { label: Englisch, value: en }, { label: Französisch, value: fr }], default: de, hint: 'Die anderen Sprachen werden nach dem Speichern automatisch übersetzt (ca. 2 Minuten). Danach unten in den Übersetzungs-Feldern prüfen.' }
      - { label: Titel, name: titel, widget: string }
      - { label: Datum, name: datum, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD }
      - { label: Kategorie, name: kategorie, widget: select, options: [Rennen, Team, Partner, Presse], default: Rennen }
      - { label: Titelbild (im Artikel), name: titelbild, widget: image, media_folder: /public/uploads/news, public_folder: /uploads/news }
      - { label: Vorschaubild (optional), name: vorschaubild, widget: image, required: false, media_folder: /public/uploads/news, public_folder: /uploads/news, hint: 'Bild für die News-Übersicht, die Startseite und Social Media. Ohne Auswahl wird das Titelbild genommen.' }
      - { label: Kurztext (Vorschau), name: teaser, widget: text, required: false }
      - { label: Als Highlight auf der Startseite zeigen, name: highlight, widget: boolean, default: false }
      - { label: Entwurf (noch nicht veröffentlichen), name: entwurf, widget: boolean, default: false }
      - label: Weitere Fotos
        name: galerie
        widget: list
        required: false
        field: { label: Foto, name: foto, widget: image, media_folder: /public/uploads/news, public_folder: /uploads/news }
      - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], editor_components: [image] }
      - { label: Hinweis zur Übersetzung (automatisch), name: uebersetzung_hinweis, widget: text, required: false, hint: 'Steht hier etwas, bitte die Übersetzungen unten kurz prüfen. Wird beim nächsten Lauf automatisch aktualisiert.' }
      - { label: Neu übersetzen (nach Änderung des Originals anhaken), name: neu_uebersetzen, widget: boolean, default: false, required: false, hint: 'Überschreibt die Übersetzungen beim nächsten Speichern. Ohne Häkchen bleiben deine Korrekturen erhalten.' }
      - { label: 'Übersetzung Deutsch (nur bei italienischem Original)', name: de, widget: object, collapsed: true, required: false, fields: [{ label: Titel, name: titel, widget: string, required: false }, { label: Kurztext, name: teaser, widget: text, required: false }, { label: Text, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Italienisch', name: it, widget: object, collapsed: true, required: false, fields: [{ label: Titolo, name: titel, widget: string, required: false }, { label: Testo breve, name: teaser, widget: text, required: false }, { label: Testo, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Englisch', name: en, widget: object, collapsed: true, required: false, fields: [{ label: Title, name: titel, widget: string, required: false }, { label: Teaser, name: teaser, widget: text, required: false }, { label: Text, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Französisch', name: fr, widget: object, collapsed: true, required: false, fields: [{ label: Titre, name: titel, widget: string, required: false }, { label: Résumé, name: teaser, widget: text, required: false }, { label: Texte, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }

  # ---------------------------------------------------------------- PRESSE
  # Presseberichte: nur Link eintragen – Überschrift, Anriss, Zeitung und Datum holt die Website selbst und übersetzt sie.
  - name: presse
    label: Presse über Luigi
    label_singular: Pressebericht
    folder: content/news
    create: true
    format: json-frontmatter
    extension: md
    slug: '{{year}}-{{month}}-{{day}}-presse-{{quelle_name}}'
    identifier_field: quelle_name
    summary: '{{datum | date("DD.MM.YYYY")}} · {{quelle_name}} · {{titel}}'
    filter: { field: kategorie, value: Presse }
    description: 'Link zum Online-Artikel einfügen und speichern. Nach ca. 2 Minuten stehen Überschrift, Anriss und die Übersetzungen im Beitrag. Den ganzen Artikel übernehmen wir nur, wenn die Zeitung es erlaubt hat (Häkchen „Abdruck genehmigt“).'
    fields:
      - { label: Kategorie, name: kategorie, widget: hidden, default: Presse }
      - { label: Link zum Artikel, name: quelle_url, widget: string, hint: 'z. B. https://www.zeitung.it/sport/luigi-catuogno-…' }
      - { label: Name der Zeitung, name: quelle_name, widget: string, hint: 'kurz, z. B. „Il Mattino“ – wird automatisch ergänzt, wenn leer' }
      - { label: Sprache des Artikels, name: sprache, widget: select, options: [{ label: Deutsch, value: de }, { label: Italienisch, value: it }, { label: Englisch, value: en }, { label: Französisch, value: fr }], default: it }
      - { label: 'Abdruck genehmigt (ganzen Artikel übernehmen)', name: abdruck_erlaubt, widget: boolean, default: false, required: false, hint: 'Nur anhaken, wenn die Zeitung schriftlich erlaubt hat, den Artikel vollständig (und übersetzt) zu zeigen. Ohne Häkchen erscheinen Überschrift, kurzer Anriss und der Link zum Original.' }
      - { label: Entwurf (noch nicht veröffentlichen), name: entwurf, widget: boolean, default: true }
      - { label: Als Highlight auf der Startseite zeigen, name: highlight, widget: boolean, default: false }
      - { label: Eigenes Bild (optional), name: titelbild, widget: image, required: false, media_folder: /public/uploads/news, public_folder: /uploads/news, hint: 'Bilder der Zeitung übernehmen wir nicht (Urheberrecht). Ohne Bild erscheint das LBC3-Bild.' }
      - { label: Neu übernehmen (Artikel erneut abrufen), name: neu_uebernehmen, widget: boolean, default: false, required: false }
      - { label: Hinweis (automatisch), name: uebersetzung_hinweis, widget: text, required: false }
      - { label: Überschrift (automatisch), name: titel, widget: string, required: false }
      - { label: Datum (automatisch), name: datum, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD, required: false }
      - { label: Erscheinungsdatum in der Zeitung (automatisch), name: quelle_datum, widget: string, required: false }
      - { label: Anriss (automatisch), name: teaser, widget: text, required: false }
      - { label: Artikeltext (nur mit Genehmigung, automatisch), name: body, widget: markdown, required: false }
      - { label: Neu übersetzen, name: neu_uebersetzen, widget: boolean, default: false, required: false }
      - { label: 'Übersetzung Deutsch', name: de, widget: object, collapsed: true, required: false, fields: [{ label: Titel, name: titel, widget: string, required: false }, { label: Kurztext, name: teaser, widget: text, required: false }, { label: Text, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Italienisch', name: it, widget: object, collapsed: true, required: false, fields: [{ label: Titolo, name: titel, widget: string, required: false }, { label: Testo breve, name: teaser, widget: text, required: false }, { label: Testo, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Englisch', name: en, widget: object, collapsed: true, required: false, fields: [{ label: Title, name: titel, widget: string, required: false }, { label: Teaser, name: teaser, widget: text, required: false }, { label: Text, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }
      - { label: 'Übersetzung Französisch', name: fr, widget: object, collapsed: true, required: false, fields: [{ label: Titre, name: titel, widget: string, required: false }, { label: Résumé, name: teaser, widget: text, required: false }, { label: Texte, name: text, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }] }


  # ---------------------------------------------------------------- RENNEN
  - name: rennen
    label: Rennen & Ergebnisse
    label_singular: Rennen
    folder: content/rennen
    create: true
    format: json
    extension: json
    slug: '{{saison}}-{{strecke}}'
    identifier_field: strecke
    summary: '{{start | date("DD.MM.YYYY")}} · {{strecke}} · {{status}}'
    sortable_fields: [start, strecke]
    fields:
      - { label: Start (Datum und Uhrzeit, deutsche Zeit), name: start, widget: datetime, date_format: DD.MM.YYYY, time_format: HH:mm, format: 'YYYY-MM-DD[T]HH:mm', hint: 'Aus diesem Wert berechnet die Website den Countdown.' }
      - { label: Saison, name: saison, widget: number, value_type: int }
      - { label: Serie, name: serie, widget: string, default: ADAC Kart Masters }
      - { label: Klasse, name: klasse, widget: string, required: false }
      - { label: Strecke, name: strecke, widget: string }
      - { label: Land, name: land, widget: select, options: [Deutschland, Italien, Österreich, Schweiz, Frankreich, Belgien, Niederlande, Spanien, Tschechien, Sonstiges], default: Deutschland }
      - { label: Status, name: status, widget: select, options: [{ label: geplant, value: bevorstehend }, { label: angemeldet, value: angemeldet }, { label: gefahren, value: gefahren }, { label: nicht gefahren, value: nicht_gefahren }], default: bevorstehend }
      - { label: Grund (nur bei „nicht gefahren“), name: grund, widget: string, required: false, hint: 'z. B. Unfall – leer lassen, wenn kein Grund angezeigt werden soll. IT/EN/FR werden automatisch übersetzt.' }
      - { label: Grund IT (automatisch), name: grund_it, widget: string, required: false }
      - { label: Grund EN (automatisch), name: grund_en, widget: string, required: false }
      - { label: Grund FR (automatisch), name: grund_fr, widget: string, required: false }
      - { label: Qualifying (z. B. P4), name: qualifying, widget: string, required: false }
      - { label: Heat 1 (z. B. P3), name: heat1, widget: string, required: false }
      - { label: Heat 2 (z. B. P2), name: heat2, widget: string, required: false }
      - { label: Platz im Finale (nur Zahl, z. B. 3), name: finale, widget: number, value_type: int, required: false, hint: 'Für die Statistik: 1 = Sieg, 1–3 = Podium.' }
      - { label: Rennbericht (News), name: bericht, widget: relation, collection: news, search_fields: [titel], value_field: '{{slug}}', display_fields: [titel], required: false }

  # ---------------------------------------------------------------- GALERIE
  - name: alben
    label: Galerie (Alben)
    label_singular: Album
    folder: content/alben
    create: true
    format: json
    extension: json
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{serie}} · {{strecke}} · {{datum}}'
    fields:
      - { label: Serie, name: serie, widget: string, hint: 'Immer gleich schreiben, z. B. „ADAC Kart Masters“, „SAKC“, „WSK“ – danach wird die Galerie gruppiert' }
      - { label: Strecke, name: strecke, widget: string, hint: 'z. B. Mülsen, Ampfing, Lonato' }
      - { label: Unteralbum (optional), name: unteralbum, widget: string, required: false, hint: 'z. B. „Testtage“ – dann erscheint das Album als Unterordner im Album mit gleicher Serie, gleichem Jahr und gleicher Strecke' }
      - { label: Datum, name: datum, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD, hint: 'Das Jahr für die Galerie wird automatisch aus dem Datum genommen' }
      - { label: Titel, name: titel, widget: string, hint: 'z. B. ADAC Kart Masters Mülsen 2026 (für die Übersicht im CMS)' }
      - { label: Titelbild (optional), name: titelbild, widget: image, required: false, media_folder: /public/uploads/galerie, public_folder: /uploads/galerie, hint: 'Ohne Auswahl wird das erste Foto genommen' }
      - { label: Auf der Startseite zeigen, name: startseite, widget: boolean, default: false }
      - { label: Reihenfolge (optional), name: reihenfolge, widget: number, value_type: int, required: false, hint: 'Kleinere Zahl = weiter vorne innerhalb der Serie (z. B. 1, 2, 3). Leer = nach Datum sortiert' }
      - label: Fotos & Videos
        name: bilder
        widget: list
        summary: '{{fields.text}}'
        hint: 'Mit „Fotos & Videos hinzufügen“ ein Foto nach dem anderen ergänzen; die Reihenfolge lässt sich per Ziehen ändern. Fotos mit erkennbaren anderen Personen nur mit deren Einwilligung!'
        fields:
          - { label: Foto oder Video, name: bild, widget: file, media_folder: /public/uploads/galerie, public_folder: /uploads/galerie }
          - { label: Kategorie, name: kategorie, widget: select, options: [{ label: Strecke, value: strecke }, { label: Fahrerlager, value: fahrerlager }], default: strecke }
          - { label: Bildunterschrift, name: text, widget: string, required: false, hint: 'Auf Deutsch. Dient auch als Bildbeschreibung (Alt-Text). IT, EN und FR werden automatisch übersetzt.' }
          - { label: Bildunterschrift IT (automatisch), name: text_it, widget: string, required: false }
          - { label: Bildunterschrift EN (automatisch), name: text_en, widget: string, required: false }
          - { label: Bildunterschrift FR (automatisch), name: text_fr, widget: string, required: false }
          - { label: Fotograf/in, name: fotograf, widget: string, required: false }
      - { label: 'Übersetzung Italienisch (automatisch)', name: it, widget: object, collapsed: true, required: false, fields: [{ label: Titel, name: titel, widget: string, required: false }, { label: Serie, name: serie, widget: string, required: false, hint: 'Nur bei Namen wie „Hinter den Kulissen“ – Seriennamen wie ADAC Kart Masters bleiben gleich' }, { label: Strecke / Albumname, name: strecke, widget: string, required: false }, { label: Unteralbum, name: unteralbum, widget: string, required: false }] }
      - { label: 'Übersetzung Englisch (automatisch)', name: en, widget: object, collapsed: true, required: false, fields: [{ label: Titel, name: titel, widget: string, required: false }, { label: Serie, name: serie, widget: string, required: false, hint: 'Nur bei Namen wie „Hinter den Kulissen“ – Seriennamen wie ADAC Kart Masters bleiben gleich' }, { label: Strecke / Albumname, name: strecke, widget: string, required: false }, { label: Unteralbum, name: unteralbum, widget: string, required: false }] }
      - { label: 'Übersetzung Französisch (automatisch)', name: fr, widget: object, collapsed: true, required: false, fields: [{ label: Titel, name: titel, widget: string, required: false }, { label: Serie, name: serie, widget: string, required: false, hint: 'Nur bei Namen wie „Hinter den Kulissen“ – Seriennamen wie ADAC Kart Masters bleiben gleich' }, { label: Strecke / Albumname, name: strecke, widget: string, required: false }, { label: Unteralbum, name: unteralbum, widget: string, required: false }] }

  # ---------------------------------------------------------------- KAPITEL
  - name: kapitel
    label: Über Luigi – Kapitel
    label_singular: Kapitel
    folder: content/kapitel
    create: true
    format: json
    extension: json
    slug: '{{nummer}}'
    identifier_field: titel
    summary: '{{nummer}} · {{titel}}'
    i18n: true
    fields:
      - { label: Nummer (z. B. 01), name: nummer, widget: string, i18n: duplicate }
      - { label: Jahr, name: jahr, widget: string, i18n: true }
      - { label: Kurztitel (Knopf), name: kurztitel, widget: string, i18n: true }
      - { label: Titel, name: titel, widget: string, i18n: true }
      - { label: Text, name: text, widget: text, i18n: true }
      - { label: Bild, name: bild, widget: image, i18n: duplicate, media_folder: /public/uploads/kapitel, public_folder: /uploads/kapitel }

  # ---------------------------------------------------------------- SPONSOREN
  - name: sponsoren
    label: Sponsoren (Logos)
    label_singular: Sponsor
    folder: content/sponsoren
    create: true
    format: json
    extension: json
    slug: '{{firma}}'
    identifier_field: firma
    summary: '{{reihenfolge}} · {{firma}} · {{paket}}'
    fields:
      - { label: Firma, name: firma, widget: string }
      - { label: Logo (PNG oder SVG, möglichst freigestellt), name: logo, widget: image, required: false, media_folder: /public/uploads/sponsoren, public_folder: /uploads/sponsoren }
      - { label: Website, name: website, widget: string, required: false }
      - { label: Paket, name: paket, widget: relation, collection: pakete, search_fields: [name], value_field: name, display_fields: [name] }
      - { label: Aktiv, name: aktiv, widget: boolean, default: true }
      - { label: Im Laufband auf der Startseite, name: im_laufband, widget: boolean, default: true }
      - { label: Reihenfolge, name: reihenfolge, widget: number, value_type: int, default: 10 }

  - name: pakete
    label: Partner-Pakete
    label_singular: Paket
    folder: content/pakete
    create: true
    format: json
    extension: json
    slug: '{{reihenfolge}}-{{name}}'
    identifier_field: name
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Untertitel, name: untertitel, widget: string, required: false, hint: 'z. B. „Der Einstieg“' }
      - { label: Reihenfolge, name: reihenfolge, widget: number, value_type: int }
      - { label: Hervorheben (dunkel), name: hervorheben, widget: boolean, default: false, required: false }
      - { label: Preis (leer lassen = kein Preis auf der Website), name: preis, widget: string, required: false }
      - { label: Leistungen, name: leistungen, widget: list }
      - { label: Laufzeit (z. B. 1 Jahr), name: laufzeit, widget: string, required: false }
      - { label: Laufzeit IT, name: laufzeit_it, widget: string, required: false }
      - { label: Laufzeit EN, name: laufzeit_en, widget: string, required: false }
      - { label: Laufzeit FR, name: laufzeit_fr, widget: string, required: false }
      - { label: Untertitel EN, name: untertitel_en, widget: string, required: false }
      - { label: Leistungen EN, name: leistungen_en, widget: list, required: false }
      - { label: Untertitel IT, name: untertitel_it, widget: string, required: false }
      - { label: Leistungen IT, name: leistungen_it, widget: list, required: false }
      - { label: Untertitel FR, name: untertitel_fr, widget: string, required: false }
      - { label: Leistungen FR, name: leistungen_fr, widget: list, required: false }

  # ---------------------------------------------------------------- EINSTELLUNGEN
  - name: einstellungen
    label: Einstellungen & Texte
    editor: { preview: false }
    files:
      - name: texte
        label: Texte (Startseite, Partner, Kontakt) – DE/IT/EN/FR
        file: content/einstellungen/texte.json
        format: json
        i18n: true
        fields:
          - { label: Startseite – Einleitung, name: hero_text, widget: text, i18n: true }
          - { label: Über Luigi – Einleitung, name: ueber_intro, widget: text, i18n: true }
          - { label: Sponsoren-Aufruf, name: sponsor_aufruf, widget: string, i18n: true }
          - { label: Partner – Einleitung, name: partner_intro, widget: text, i18n: true }
          - { label: Squadra Tre – Text, name: squadra_text, widget: text, i18n: true }
          - { label: Kontakt – Einleitung, name: kontakt_intro, widget: text, i18n: true }
          - { label: Helm – Überschrift, name: helm_titel, widget: string, i18n: true, required: false }
          - { label: Helm – Text (Absätze mit Leerzeile trennen), name: helm_text, widget: text, i18n: true, required: false }
          - label: Helm – Fotos
            name: helm_bilder
            widget: list
            required: false
            summary: '{{fields.text}}'
            hint: 'Das erste Foto wird groß angezeigt'
            fields:
              - { label: Foto, name: bild, widget: image, media_folder: /public/uploads/helm, public_folder: /uploads/helm }
              - { label: Bildunterschrift, name: text, widget: string, required: false }
              - { label: Bildunterschrift IT, name: text_it, widget: string, required: false }
              - { label: Bildunterschrift EN, name: text_en, widget: string, required: false }
              - { label: Bildunterschrift FR, name: text_fr, widget: string, required: false }
      - name: fahrer
        label: Steckbrief & Rennwoche – DE/IT/EN/FR
        file: content/einstellungen/fahrer.json
        format: json
        i18n: true
        fields:
          - { label: Nationalität, name: nationalitaet, widget: string, i18n: true }
          - { label: Chassis, name: chassis, widget: string, i18n: duplicate }
          - { label: Klasse, name: klasse, widget: string, i18n: true }
          - { label: Team, name: team, widget: string, i18n: duplicate }
          - { label: Team-Website (Link), name: team_link, widget: string, i18n: duplicate, required: false, hint: 'z. B. https://www.7l-performance.de – der Teamname wird dann im Steckbrief verlinkt' }
          - { label: Lieblingsstrecke, name: lieblingsstrecke, widget: string, i18n: true }
          - { label: Idol(e), name: idole, widget: string, i18n: duplicate }
          - { label: Ziel, name: ziel, widget: string, i18n: true }
          - label: Eine Rennwoche mit Luigi
            name: woche
            widget: list
            i18n: true
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Was passiert, name: was, widget: string }
              - { label: Foto, name: bild, widget: image, required: false, media_folder: /public/uploads/woche, public_folder: /uploads/woche }
      - name: site
        label: Allgemein, Bilder, Impressum & Datenschutz
        file: content/einstellungen/site.json
        format: json
        fields:
          - { label: "Bald-Modus (Besucher sehen nur „Wir sind fast am Ziel …“)", name: bald_modus, widget: boolean, default: false, hint: 'Ausschalten und veröffentlichen = Website für alle sichtbar. Das Team sieht die echte Website über luigi-catuogno.com/vorschau/' }
          - { label: Start-Datum für den Countdown (deutsche Zeit), name: start_datum, widget: datetime, date_format: DD.MM.YYYY, time_format: HH:mm, format: 'YYYY-MM-DD[T]HH:mm', required: false }
          - { label: Name, name: name, widget: string }
          - { label: Marke, name: marke, widget: string }
          - { label: Startnummer, name: startnummer, widget: string }
          - { label: Kontakt-E-Mail, name: kontakt_email, widget: string }
