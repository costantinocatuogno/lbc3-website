# Decap CMS – Redaktionsoberfläche unter https://DEINE-DOMAIN/admin/
# Jede Änderung wird als Commit im GitHub-Repository gespeichert; Netlify baut die Website danach automatisch neu (1–2 Minuten).

backend:
  name: github
  repo: GITHUB-BENUTZER/lbc3-website   # ← anpassen (siehe README, Schritt 4)
  branch: main
  base_url: https://api.netlify.com     # Netlify übernimmt die GitHub-Anmeldung (OAuth)
  commit_messages:
    create: 'Neu: {{collection}} „{{slug}}“'
    update: 'Geändert: {{collection}} „{{slug}}“'
    delete: 'Gelöscht: {{collection}} „{{slug}}“'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'

locale: de
site_url: https://DEINE-DOMAIN
display_url: https://DEINE-DOMAIN
logo_url: /assets/img/lbc3-logo.png
media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: single_file
  locales: [de, en, it]
  default_locale: de

collections:
  # ---------------------------------------------------------------- NEWS
  - name: news
    label: News & Rennberichte
    label_singular: Beitrag
    folder: content/news
    create: true
    format: json-frontmatter
    extension: md
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{datum | date("DD.MM.YYYY")}} · {{titel}}'
    sortable_fields: [datum, titel]
    view_filters:
      - { label: Highlights, field: highlight, pattern: true }
      - { label: Entwürfe, field: entwurf, pattern: true }
    fields:
      - { label: Titel, name: titel, widget: string }
      - { label: Datum, name: datum, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD }
      - { label: Kategorie, name: kategorie, widget: select, options: [Rennen, Team, Partner], default: Rennen }
      - { label: Titelbild, name: titelbild, widget: image, media_folder: /public/uploads/news, public_folder: /uploads/news }
      - { label: Kurztext (Vorschau), name: teaser, widget: text, required: false }
      - { label: Als Highlight auf der Startseite zeigen, name: highlight, widget: boolean, default: false }
      - { label: Entwurf (noch nicht veröffentlichen), name: entwurf, widget: boolean, default: false }
      - label: Weitere Fotos
        name: galerie
        widget: list
        required: false
        field: { label: Foto, name: foto, widget: image, media_folder: /public/uploads/news, public_folder: /uploads/news }
      - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], editor_components: [image] }

  # ---------------------------------------------------------------- RENNEN
  - name: rennen
    label: Rennen & Ergebnisse
    label_singular: Rennen
    folder: content/rennen
    create: true
    format: json
    extension: json
    slug: '{{saison}}-{{strecke}}'
    identifier_field: strecke
    summary: '{{start | date("DD.MM.YYYY")}} · {{strecke}} · {{status}}'
    sortable_fields: [start, strecke]
    fields:
      - { label: Start (Datum und Uhrzeit, deutsche Zeit), name: start, widget: datetime, date_format: DD.MM.YYYY, time_format: HH:mm, format: 'YYYY-MM-DD[T]HH:mm', hint: 'Aus diesem Wert berechnet die Website den Countdown.' }
      - { label: Saison, name: saison, widget: number, value_type: int }
      - { label: Serie, name: serie, widget: string, default: ADAC Kart Masters }
      - { label: Klasse, name: klasse, widget: string, required: false }
      - { label: Strecke, name: strecke, widget: string }
      - { label: Land, name: land, widget: select, options: [Deutschland, Italien, Österreich, Schweiz, Frankreich, Belgien, Niederlande, Spanien, Tschechien, Sonstiges], default: Deutschland }
      - { label: Status, name: status, widget: select, options: [{ label: bevorstehend, value: bevorstehend }, { label: gefahren, value: gefahren }], default: bevorstehend }
      - { label: Qualifying (z. B. P4), name: qualifying, widget: string, required: false }
      - { label: Platz im Finale (nur Zahl, z. B. 3), name: finale, widget: number, value_type: int, required: false, hint: 'Für die Statistik: 1 = Sieg, 1–3 = Podium.' }
      - { label: Rennbericht (News), name: bericht, widget: relation, collection: news, search_fields: [titel], value_field: '{{slug}}', display_fields: [titel], required: false }

  # ---------------------------------------------------------------- GALERIE
  - name: alben
    label: Galerie (Alben)
    label_singular: Album
    folder: content/alben
    create: true
    format: json
    extension: json
    slug: '{{slug}}'
    identifier_field: titel
    summary: '{{titel}}'
    fields:
      - { label: Titel, name: titel, widget: string, hint: 'z. B. ADAC Kart Masters Ampfing 2026' }
      - { label: Datum, name: datum, widget: datetime, date_format: DD.MM.YYYY, time_format: false, format: YYYY-MM-DD }
      - { label: Auf der Startseite zeigen, name: startseite, widget: boolean, default: false }
      - label: Fotos & Videos
        name: bilder
        widget: list
        summary: '{{fields.text}}'
        hint: 'Mit „Fotos & Videos hinzufügen“ ein Foto nach dem anderen ergänzen; die Reihenfolge lässt sich per Ziehen ändern. Fotos mit erkennbaren anderen Personen nur mit deren Einwilligung!'
        fields:
          - { label: Foto oder Video, name: bild, widget: file, media_folder: /public/uploads/galerie, public_folder: /uploads/galerie }
          - { label: Kategorie, name: kategorie, widget: select, options: [{ label: Strecke, value: strecke }, { label: Fahrerlager, value: fahrerlager }], default: strecke }
          - { label: Bildunterschrift, name: text, widget: string, required: false }
          - { label: Fotograf/in, name: fotograf, widget: string, required: false }

  # ---------------------------------------------------------------- KAPITEL
  - name: kapitel
    label: Über Luigi – Kapitel
    label_singular: Kapitel
    folder: content/kapitel
    create: true
    format: json
    extension: json
    slug: '{{nummer}}'
    identifier_field: titel
    summary: '{{nummer}} · {{titel}}'
    i18n: true
    fields:
      - { label: Nummer (z. B. 01), name: nummer, widget: string, i18n: duplicate }
      - { label: Jahr, name: jahr, widget: string, i18n: duplicate }
      - { label: Kurztitel (Knopf), name: kurztitel, widget: string, i18n: true }
      - { label: Titel, name: titel, widget: string, i18n: true }
      - { label: Text, name: text, widget: text, i18n: true }
      - { label: Bild, name: bild, widget: image, i18n: duplicate, media_folder: /public/uploads/kapitel, public_folder: /uploads/kapitel }

  # ---------------------------------------------------------------- SPONSOREN
  - name: sponsoren
    label: Sponsoren (Logos)
    label_singular: Sponsor
    folder: content/sponsoren
    create: true
    format: json
    extension: json
    slug: '{{firma}}'
    identifier_field: firma
    summary: '{{reihenfolge}} · {{firma}} · {{paket}}'
    fields:
      - { label: Firma, name: firma, widget: string }
      - { label: Logo (PNG oder SVG, möglichst freigestellt), name: logo, widget: image, required: false, media_folder: /public/uploads/sponsoren, public_folder: /uploads/sponsoren }
      - { label: Website, name: website, widget: string, required: false }
      - { label: Paket, name: paket, widget: relation, collection: pakete, search_fields: [name], value_field: name, display_fields: [name] }
      - { label: Aktiv, name: aktiv, widget: boolean, default: true }
      - { label: Im Laufband auf der Startseite, name: im_laufband, widget: boolean, default: true }
      - { label: Reihenfolge, name: reihenfolge, widget: number, value_type: int, default: 10 }

  - name: pakete
    label: Sponsoring-Pakete
    label_singular: Paket
    folder: content/pakete
    create: true
    format: json
    extension: json
    slug: '{{reihenfolge}}-{{name}}'
    identifier_field: name
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Reihenfolge, name: reihenfolge, widget: number, value_type: int }
      - { label: Preis, name: preis, widget: string, hint: 'z. B. „ab 2.500 € / Saison“' }
      - { label: Leistungen, name: leistungen, widget: list }

  # ---------------------------------------------------------------- EINSTELLUNGEN
  - name: einstellungen
    label: Einstellungen & Texte
    editor: { preview: false }
    files:
      - name: texte
        label: Texte (Startseite, Partner, Kontakt) – DE/EN/IT
        file: content/einstellungen/texte.json
        format: json
        i18n: true
        fields:
          - { label: Startseite – Einleitung, name: hero_text, widget: text, i18n: true }
          - { label: Über Luigi – Einleitung, name: ueber_intro, widget: text, i18n: true }
          - { label: Sponsoren-Aufruf, name: sponsor_aufruf, widget: string, i18n: true }
          - { label: Partner – Einleitung, name: partner_intro, widget: text, i18n: true }
          - { label: Squadra 3 – Text, name: squadra_text, widget: text, i18n: true }
          - { label: Kontakt – Einleitung, name: kontakt_intro, widget: text, i18n: true }
      - name: fahrer
        label: Steckbrief & Rennwoche – DE/EN/IT
        file: content/einstellungen/fahrer.json
        format: json
        i18n: true
        fields:
          - { label: Nationalität, name: nationalitaet, widget: string, i18n: true }
          - { label: Chassis, name: chassis, widget: string, i18n: duplicate }
          - { label: Klasse, name: klasse, widget: string, i18n: true }
          - { label: Team, name: team, widget: string, i18n: true }
          - { label: Lieblingsstrecke, name: lieblingsstrecke, widget: string, i18n: true }
          - { label: Idole, name: idole, widget: string, i18n: duplicate }
          - { label: Ziel, name: ziel, widget: string, i18n: true }
          - label: Eine Rennwoche mit Luigi
            name: woche
            widget: list
            i18n: true
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Was passiert, name: was, widget: string }
              - { label: Foto, name: bild, widget: image, required: false, media_folder: /public/uploads/woche, public_folder: /uploads/woche }
      - name: site
        label: Allgemein, Bilder, Impressum & Datenschutz
        file: content/einstellungen/site.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Marke, name: marke, widget: string }
          - { label: Startnummer, name: startnummer, widget: string }
          - { label: Kontakt-E-Mail, name: kontakt_email, widget: string }
          - { label: E-Mail für Sponsoren-Anfragen, name: business_email, widget: string }
          - { label: Instagram-Link, name: instagram, widget: string }
          - { label: Instagram-Name, name: instagram_handle, widget: string }
          - { label: Haupt-Hashtag, name: hashtag, widget: string, default: '#LBC3' }
          - { label: Hashtag Squadra 3, name: squadra_hashtag, widget: string, default: '#SquadraLBC3' }
          - { label: Saison auf der gedruckten Wall of Fame, name: saison_wall, widget: string, default: '2026' }
          - { label: Intro-Video (MP4, Hochformat, max. ca. 2 MB), name: intro_video, widget: file }
          - { label: Helm-Bild (rund, freigestellt), name: helm_bild, widget: image }
          - { label: Bild „Über Luigi“, name: hero_bild, widget: image }
          - { label: Bild „On Track“, name: on_track_bild, widget: image }
          - { label: Bild „Off Track“, name: off_track_bild, widget: image }
          - { label: Bild Partner/Sponsoren-Aufruf, name: partner_bild, widget: image }
          - { label: Bild Login-Seite, name: login_bild, widget: image }
          - { label: Sponsorenmappe (PDF, optional – sonst Anfrage über Kontakt), name: sponsorenmappe_pdf, widget: file, required: false }
          - { label: Zahlungsinfo Squadra 3 (nur Info – der E-Mail-Text kommt aus der Netlify-Einstellung SQUADRA_ZAHLUNGSINFO), name: zahlungsinfo, widget: text, required: false }
          - { label: Impressum, name: impressum, widget: markdown }
          - { label: Datenschutzerklärung, name: datenschutz, widget: markdown }
      - name: wand
        label: Squadra-3-Wand (Beispielnamen, solange Supabase nicht verbunden ist)
        file: content/einstellungen/squadra-wand-beispiel.json
        format: json
        fields:
          - { label: Namen, name: namen, widget: list }
