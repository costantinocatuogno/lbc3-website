# Automatische Übersetzung – gebündelt (Wunsch Costa 02.11.2026: Netlify-Guthaben sparen):
# Läuft EINMAL PRO NACHT (ca. 02:40 Berliner Zeit) statt nach jedem Speichern im CMS. Alle fehlenden Sprachfassungen
# (IT/EN/FR bzw. DE) des Tages kommen in EINEN Commit → nur EINE zusätzliche Veröffentlichung pro Tag, und nur wenn
# es etwas zu übersetzen gab. Bis dahin zeigt die Website neue Texte in der Originalsprache (eingebauter Rückfall).
# Sofort übersetzen: GitHub → Actions → „Inhalte übersetzen“ → „Run workflow“. Schlägt der Lauf fehl, schickt GitHub eine E-Mail.
name: Inhalte übersetzen

on:
  schedule:
    - cron: '40 1 * * *'   # 01:40 UTC = 02:40 MEZ / 03:40 MESZ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uebersetzen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uebersetzen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Presseberichte übernehmen
        run: node scripts/import-presse.mjs
      - name: Fehlende Übersetzungen erzeugen
        id: tr
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: node scripts/translate.mjs
      - name: Übersetzungen speichern
        if: always()
        env:
          SUMMARY: ${{ steps.tr.outputs.summary }}
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "LBC3 Übersetzung"
            git config user.email "actions@users.noreply.github.com"
            git add content
            git commit -m "Automatisch übersetzt: ${SUMMARY:-Inhalte}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nichts zu speichern."
          fi
